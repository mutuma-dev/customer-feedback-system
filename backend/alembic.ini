# Alembic = the tool that creates and changes database tables in versioned steps ("migrations").
[alembic]
# the folder that holds env.py and the migration files
script_location = alembic
# lets Alembic import our "app" package
prepend_sys_path = .

# ---- logging settings (how much Alembic prints) ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
